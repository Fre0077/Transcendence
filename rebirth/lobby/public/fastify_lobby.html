<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong Client</title>
  <style>
    canvas { background: #000; display: none; margin: 20px auto; }
    #ui { text-align: center; margin-top: 20px; }
    #lobbyCode { margin-top: 10px; font-weight: bold; }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="playerID">playerID</div>
  <div id="ui">
    <button id="btnCreate">Create Lobby</button>
    <br/><br/>

    <input id="joinInput" placeholder="Lobby code or ANY" />
    <button id="btnJoin">Join Lobby</button>
    <br/><br/>
    <button id="btnLeave">Leave Lobby</button>
    <br/><br/>
    <button id="btnAddBot">Add BOT</button><label for="botlvl">
    Bot Level: <span id="botValue">50</span>
    </label>
    <input
      type="range"
      id="botlvl"
      min="0"
      max="100"
      value="50"
    />
    <br>
    <button id="btnRemBot">Rem BOT</button>
	<br/><br/>

	<button id="btnStart">Start Game</button><button id="btnRejoin">Rejoin Game</button>
	<br/><br/>

    <div id="lobbyCode"></div>
    <div id="clientLog">Waiting...</div>
    <div id="serverLog">Waiting...</div>
  </div>
  <div id="players">
	Players
  </div>

  <footer>
  Lobbies:<br>
    <div id="lobbies"></div>
  </footer>
  <script>

    let playerID, lobbyID;
  
    try {
      const data = JSON.parse(sessionStorage.getItem("sesData"));

        // YOINK the data
        playerID = data.playerID;
        lobbyID = data.lobbyID;

    } catch (err) {
      console.log("Error whil parsing session data:", err);

      // Ask the user for their player ID
      playerID = prompt("Enter your Player ID:", "");
      
      // If they press cancel or type nothing, give them a default value
      if (!playerID) {
        playerID = "UnknownPlayer";
      }
    }

    // Display it on the page
    document.getElementById("playerID").innerText = playerID;

    const scoreboard = document.getElementById("scoreboard");
    const serverLog = document.getElementById("serverLog");
    const clientLog = document.getElementById("clientLog");
    const lobbyCodeDiv = document.getElementById("lobbyCode");

    const joinInput = document.getElementById("joinInput");
    const btnCreate = document.getElementById("btnCreate");
    const btnJoin = document.getElementById("btnJoin");
    const btnLeave = document.getElementById("btnLeave");
	  const btnStart = document.getElementById("btnStart");
    const btnRejoin = document.getElementById("btnRejoin");

    const btnAddBot = document.getElementById("btnAddBot");
    const btnRemBot = document.getElementById("btnRemBot");

	  const playersDiv = document.getElementById("players");

    // slider for bot level
    const slider = document.getElementById("botlvl");
    const output = document.getElementById("botValue");

    output.textContent = slider.value;

    slider.addEventListener("input", () => {
      output.textContent = slider.value;
    });
    //--------

    const socket = new WebSocket(`ws://${window.location.host}/lobbysocket`);

    // visualize playerID
    document.getElementById("playerID").innerHTML = playerID;

    /* STARTUP PROCEDURE for FRONTEND @aleborghi */
    /*
      first you create a lobby,
      the backend will send the ID of the lobby created:
        { method: 'CREATE_REPLY', status: 'success', value: '<lobbyID>' }

      the other players will join the lobby
      if 'value' is set to 'ANY', the first lobby with an empty slot will be joined.
      the backend will send a reply:
      { method: 'JOIN_REPLY', status: 'success', value: '<lobbyID>' }
      if the join failed because the <lobbyID> was not found or no lobby were yet created
      (ANY case), the status will be set to 'failure'.

      then the lobby can be STARTed.

      When the lobby is in game the lobbyStatus.ingame value is set to true
    */

    /* -------------------------
       UI BUTTON HANDLERS
    -------------------------- */

    let rejoin = false;

    // CREATE
    btnCreate.onclick = () => {
      socket.send(JSON.stringify({ method: "CREATE", format: 12 }));
      clientLog.innerText = "Creating lobby...";
    };

    // JOIN
    btnJoin.onclick = () => {
      const code = joinInput.value.trim() || "ANY";
      socket.send(JSON.stringify({ method: "JOIN", lobbyID: code }));
      clientLog.innerText = `Joining lobby: ${code}...`;
    };

    // LEAVE
    btnLeave.onclick = () => {
      socket.send(JSON.stringify({ method: "LEAVE" }));
      clientLog.innerText = `Leaving lobby ...`;
    };

    // START
	  btnStart.onclick = () => {
      socket.send(JSON.stringify({ method: "START" }));
      clientLog.innerText = "Starting game...";
    };

    // REJOIN
	  btnRejoin.onclick = () => {
      rejoin = true;
      clientLog.innerText = "Rejoining game...";
    };

    // BOT
    btnAddBot.onclick = () => {
      socket.send(JSON.stringify({ method: "BOT", value: "ADD", level: Number(slider.value) }));
      clientLog.innerText = "Adding bot...";
    };

    btnRemBot.onclick = () => {
      socket.send(JSON.stringify({ method: "BOT", value: "REMOVE" }));
      clientLog.innerText = "Removing bot...";
    };

    //-----------------------------------------------
    // start talking with the game backend @aleborghi

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function startGame(myGameID, myPlayerID) {
      clientLog.innerText = `Game Started ${myGameID}`;

      // open new window
      sessionStorage.setItem("sesData", JSON.stringify({
        gameID: myGameID,
        playerID: myPlayerID,
        lobbyID: lobbyID
      }));

      window.location.href = "/pong";  // same window
    }

    /* -------------------------
       WEBSOCKET EVENTS
    -------------------------- */

    socket.addEventListener("open", () => {
      console.log("Connected to server");
      clientLog.innerText = "Connected.";

      // instantly AUTH after socket connection
      socket.send(JSON.stringify({ method: "AUTH", playerID: playerID }));

      if (lobbyID !== undefined) {
        sleep(1100) // @aleborghi sleeppino quando ti riconnetti all lobby dopo la partita
        .then(() => {
          socket.send(JSON.stringify({ method: "JOIN", lobbyID: lobbyID }));
          clientLog.innerText = `Joining lobby: ${lobbyID}...`;
        });
      }
    });

    socket.addEventListener("message", (event) => {
      try {
        console.log("TYPE OF MESSAGE:", typeof event.data, event.data);
        const data = JSON.parse(event.data);

        /* ---------------
           LOBBY CREATION
        ----------------- */
        if (data.method === "CREATE_REPLY") {
          if (data.status === 'success') {
            lobbyID = data.value;
            lobbyCodeDiv.innerHTML = lobbyID;
            serverLog.innerText = `Lobby created! Code: ${lobbyID}`;
          }
          else if (data.status === 'failure')
            serverLog.innerText = `Failed to create the Lobby\n${data.comment}`;
          return;
        }

        /* -----------
           LOBBY JOIN
        ------------ */
        if (data.method === "JOIN_REPLY") {
		      if (data.status === 'success') {
            lobbyID = data.value;
            lobbyCodeDiv.innerHTML = lobbyID;
          	serverLog.innerText = `Joined lobby ${data.value}`;
          } else if (data.status === 'failure')
		        serverLog.innerText = `Failed to join ${data.value}: ${data.comment}`;
          return;
        }

         /* -----------
           LOBBY LEAVE
        ------------ */
        if (data.method === "LEAVE_REPLY") {
		      if (data.status === 'success') {
            playersDiv.innerHTML = "players"; // clear
            lobbyCodeDiv.innerHTML = "";      // clear
          	serverLog.innerText = `Success: ${data.comment}`;
            lobbyID = undefined;
          } else if (data.status === 'failure')
		        serverLog.innerText = `Failure: ${data.comment}`;
          return;
        }

        /* -----------
          GAME START
        ------------ */
        if (data.method === "START_REPLY") {
          if (data.status === 'success') {
              startGame(data.value, playerID);
          }
          else if (data.status === 'failure')
            serverLog.innerText = `Failed to start game: ${data.comment}`;
          return;
        }

        /* ----------------------
           OTHER SERVER MESSAGES
        ----------------------- */
        serverLog.innerText = event.data;

      } catch (err) {
        console.log("Error ", err);
        console.error("ACTUAL RAW STRING:", JSON.stringify(event.data));
        console.error("CHAR CODES:", [...event.data].map(c => c.charCodeAt(0)));
        clientLog.innerText = `Bad JSON: ${event.data}`;
      }
    });

    setInterval(() => {
      if (lobbyID === undefined) return;
    
      fetch(`http://${window.location.host}/my-lobby?ID=${lobbyID}`)
        .then(res => res.text())
        .then(text => {
          let data;
          try {
            data = JSON.parse(text); 
          } catch (err) {
            console.error("JSON parse failed:", text);
            return;
          }

          if (!data.state) {
            console.warn("Invalid lobby format:", data);
            return;
          }
          const state = data.state;

          playersDiv.innerHTML = ""; // clear
			    let html = "";
			    for (let i = 0; i < state.players.length; i++) {
				    html += `${state.players[i].ID} : ${state.players[i].status}<br>`;
			    }
          playersDiv.innerHTML = html;

          if (state.ingame === true && rejoin === true) {
            startGame(state.gameID, playerID);
            rejoin = false;
          }

        })
        .catch(err => console.error("Fetch failed:", err));
    }, 1000);

    // All lobbies
    const lobbies = document.getElementById("lobbies");

    setInterval(() => {
      fetch(`http://${window.location.host}/lobbies`)
        .then(res => res.text())
        .then(text => {
          let data;
          try {
            data = JSON.parse(text); 
          } catch (err) {
            console.error("JSON parse failed:", text);
            return;
          }

          if (!Array.isArray(data.states)) {
            console.warn("Invalid /lobbies format:", data);
            return;
          }

          let html = "";
          for (const lobby of data.states) {
            html += `${lobby.ID}<br>`;
            for (const p of lobby.state.players)
              html += `${p.ID} - ${p.status}<br>`;
          }

          if (lobbies) lobbies.innerHTML = html;
        })
        .catch(err => console.error("Fetch failed:", err));
    }, 1000);

  </script>
</body>
</html>
