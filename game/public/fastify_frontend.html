<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong Client</title>
  <style>
    canvas { background: #000; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="scoreboard", align="center">
    P1 : P2
  </div>
  <canvas id="game" width="600" height="600"></canvas>
  <script>
    const scoreboard = document.getElementById("scoreboard"); // me :D
    
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // 👇 Update the WebSocket URL to match your Fastify route
    // For example, if your Fastify route is fastify.get('/ws', { websocket: true }, ...)
    const socket = new WebSocket(`ws://${window.location.host}/websocket`);

    socket.addEventListener("open", () => {
      console.log("Connected to Fastify WebSocket server");
    });

    socket.addEventListener("message", (event) => {
      try {
        const data = JSON.parse(event.data);
        drawGame(data);
      } catch (err) {
        console.error("Bad JSON:", event.data);
      }
    });

    function drawGame(state) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const paddleHeight = canvas.height * state.paddle[0].height;
      const paddleWidth = canvas.width * state.paddle[0].width;
      const paddleOffset = canvas.width * state.paddle[0].offset;
      const ballSize = 10;

      // console.log(`pH: ${paddleHeight}, pW: ${paddleWidth}, pO: ${paddleOffset}`);

      // Score
      scoreboard.innerHTML = `${state.score[0]} : ${state.score[1]}`;

      ctx.fillStyle = "white";

      // Midline
      ctx.fillRect(
        canvas.width / 2,
        0,
        2,
        canvas.height,
      );

      // Ball
      ctx.fillRect(
        state.ball[0] * canvas.width - (ballSize / 2),
        state.ball[1] * canvas.height - (ballSize / 2),
        ballSize,
        ballSize);

      // Player 1
      ctx.fillRect(
        paddleOffset,
        (state.player1 * canvas.height) - (paddleHeight / 2),
        paddleWidth,
        paddleHeight);

      // Player 2
      ctx.fillRect(
        canvas.width - paddleOffset - 10,
        (state.player2 * canvas.height) - (paddleHeight / 2),
        paddleWidth,
        paddleHeight);
    }

    document.addEventListener("keydown", (e) => {
      if (e.repeat) return; // ignore held-down repeat events

      switch (e.key) {
        case "f": socket.send("P1UP_PRESS"); break;
        case "v": socket.send("P1DW_PRESS"); break;
        case "j": socket.send("P2UP_PRESS"); break;
        case "n": socket.send("P2DW_PRESS"); break;
        case " ": socket.send("START_PRESS"); break;
        case "r": socket.send("RESET_PRESS"); break;
      }
    });

    document.addEventListener("keyup", (e) => {
      switch (e.key) {
        case "f": socket.send("P1UP_RELEASE"); break;
        case "v": socket.send("P1DW_RELEASE"); break;
        case "j": socket.send("P2UP_RELEASE"); break;
        case "n": socket.send("P2DW_RELEASE"); break;
      }
    });
  </script>
</body>
</html>
