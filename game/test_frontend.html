<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong Client</title>
  <style>
    canvas { background: #000; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <canvas id="game" width="600" height="600"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const socket = new WebSocket("ws://localhost:1337");

    socket.addEventListener("open", () => {
      console.log("Connected to server");
    });

    socket.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);
      drawGame(data);
    });

    function drawGame(state) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const paddleHeight = 100;
      const paddleWidth = 10;
      const ballSize = 10;

      // Draw ball
      ctx.fillStyle = "white";
      ctx.fillRect(state.ball[0] * canvas.width, state.ball[1] * canvas.height, ballSize, ballSize);

      // Draw player 1
      ctx.fillRect(20, state.player1 * canvas.height - paddleHeight / 2, paddleWidth, paddleHeight);

      // Draw player 2
      ctx.fillRect(canvas.width - 30, state.player2 * canvas.height - paddleHeight / 2, paddleWidth, paddleHeight);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "w") socket.send("W_PRESS\n");
      if (e.key === "s") socket.send("S_PRESS\n");
      if (e.key === " ") socket.send("SPACE_PRESS\n");
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "w") socket.send("W_RELEASE\n");
      if (e.key === "s") socket.send("S_RELEASE\n");
    });

	document.addEventListener("keydown", (e) => {
      if (e.key === "i") socket.send("I_PRESS\n");
      if (e.key === "k") socket.send("K_PRESS\n");
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "i") socket.send("I_RELEASE\n");
      if (e.key === "k") socket.send("K_RELEASE\n");
    });
  </script>
</body>
</html>
