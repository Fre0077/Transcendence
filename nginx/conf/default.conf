server {
    listen 8080;
    server_name localhost;
    return 301 https://$host$request_uri; # Redirect ignorante a HTTPS
}

server {
    listen 4443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Ottimizzazioni SSL standard
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. FRONTEND
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	location /rabbitmq/ {
		proxy_pass http://rabbitmq:15672/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

    # 2. BUTLER (API Gateway)
    # Qualsiasi chiamata che inizi con /api/ viene pulita e mandata al Butler
    location /api/ {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://butler:3029;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fondamentale per i tuoi cookie HttpOnly
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;
    }

    # 3. WEBSOCKETS (Pong & Chat)
    # Se i tuoi socket passano dal Butler, punta a lui.
    location /ws/ {
        proxy_pass http://butler:3029;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}