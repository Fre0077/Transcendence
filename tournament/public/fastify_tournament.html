<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong Client</title>
  <style>
	canvas { background: #000; display: none; margin: 20px auto; }
	#ui { text-align: center; margin-top: 20px; }
	#tournamentCode { margin-top: 10px; font-weight: bold; }
	footer {
	  position: fixed;
	  bottom: 0;
	  left: 0;
	  width: 100%;
	  padding: 10px;
	}
	#bracket {
		display: flex;
		gap: 40px;
		margin-top: 20px;
		justify-content: center;
	}
	.round {
		display: flex;
		flex-direction: column;
		gap: 20px;
	}
	.match {
		border: 1px solid #aaa;
		padding: 8px;
		background: #111;
		color: #fff;
		min-width: 140px;
	}
	.match .winner {
		color: #0f0;
		font-weight: bold;
	}
  </style>
</head>
<body>
  <div id="playerID">playerID</div>
  <div id="ui">
	<button id="btnCreate">Create tournament</button>
	<br/><br/>

	<input id="joinInput" placeholder="tournament code or ANY" />
	<button id="btnJoin">Join tournament</button>
	<br/><br/>
	<button id="btnLeave">Leave tournament</button>
	<br/><br/>
	<button id="btnAddBot">Add BOT</button><label for="botlvl">
	Bot Level: <span id="botValue">50</span>
	</label>
	<input
	  type="range"
	  id="botlvl"
	  min="0"
	  max="100"
	  value="50"
	/>
	<br>
	<button id="btnRemBot">Rem BOT</button>
	<br/><br/>

	<button id="btnReady">Ready</button><button id="btnRejoin">Rejoin Game</button>
	<br/><br/>

	<div id="tournamentCode"></div>
	<div id="clientLog">Waiting...</div>
	<div id="serverLog">Waiting...</div>
  </div>

  	<div id="players" style="display:none;">
		Players
	</div>

	<!-- Tournament bracket visualization -->
	<div id="bracket"></div>

  <script>

	let playerID, tournamentID;
  
	try {
	  const data = JSON.parse(sessionStorage.getItem("sesData"));

		// YOINK the data
		playerID = data.playerID;
		tournamentID = data.tournamentID;

	} catch (err) {
	  console.log("Error whil parsing session data:", err);

	  // Ask the user for their player ID
	  playerID = prompt("Enter your Player ID:", "");
	  
	  // If they press cancel or type nothing, give them a default value
	  if (!playerID) {
		playerID = "UnknownPlayer";
	  }
	}

	// Display it on the page
	document.getElementById("playerID").innerText = playerID;

	const scoreboard = document.getElementById("scoreboard");
	const serverLog = document.getElementById("serverLog");
	const clientLog = document.getElementById("clientLog");
	const tournamentCodeDiv = document.getElementById("tournamentCode");

	const joinInput = document.getElementById("joinInput");
	const btnCreate = document.getElementById("btnCreate");
	const btnJoin = document.getElementById("btnJoin");
	const btnLeave = document.getElementById("btnLeave");
	const btnReady = document.getElementById("btnReady");
	const btnRejoin = document.getElementById("btnRejoin");

	const btnAddBot = document.getElementById("btnAddBot");
	const btnRemBot = document.getElementById("btnRemBot");

	  const playersDiv = document.getElementById("players");

	// slider for bot level
	const slider = document.getElementById("botlvl");
	const output = document.getElementById("botValue");

	output.textContent = slider.value;

	slider.addEventListener("input", () => {
	  output.textContent = slider.value;
	});
	//--------

	const socket = new WebSocket(`ws://${window.location.host}/tournamentsocket`);

	// visualize playerID
	document.getElementById("playerID").innerHTML = playerID;

	/* STARTUP PROCEDURE for FRONTEND @aleborghi */
	/*
	  first you create a tournament,
	  the backend will send the ID of the tournament created:
		{ method: 'CREATE_REPLY', status: 'success', value: '<tournamentID>' }

	  the other players will join the tournament
	  if 'value' is set to 'ANY', the first tournament with an empty slot will be joined.
	  the backend will send a reply:
	  { method: 'JOIN_REPLY', status: 'success', value: '<tournamentID>' }
	  if the join failed because the <tournamentID> was not found or no tournament were yet created
	  (ANY case), the status will be set to 'failure'.

	  then the tournament can be STARTed.

	  When the tournament is in game the tournamentStatus.ingame value is set to true
	*/

	/* -------------------------
	   UI BUTTON HANDLERS
	-------------------------- */

	let rejoin = false;

	// CREATE
	btnCreate.onclick = () => {
	  socket.send(JSON.stringify({ method: "CREATE", format: 12 }));
	  clientLog.innerText = "Creating tournament...";
	};

	// JOIN
	btnJoin.onclick = () => {
	  const code = joinInput.value.trim() || "ANY";
	  socket.send(JSON.stringify({ method: "JOIN", tournamentID: code }));
	  clientLog.innerText = `Joining tournament: ${code}...`;
	};

	// LEAVE
	btnLeave.onclick = () => {
	  socket.send(JSON.stringify({ method: "LEAVE" }));
	  clientLog.innerText = `Leaving tournament ...`;
	};

	// START
	btnReady.onclick = () => {
	  socket.send(JSON.stringify({ method: "READY" }));
	  clientLog.innerText = "Getting ready ...";
	};

	// REJOIN
	  btnRejoin.onclick = () => {
	  rejoin = true;
	  clientLog.innerText = "Rejoining game...";
	};

	// BOT
	btnAddBot.onclick = () => {
	  socket.send(JSON.stringify({ method: "BOT", value: "ADD", level: Number(slider.value) }));
	  clientLog.innerText = "Adding bot...";
	};

	btnRemBot.onclick = () => {
	  socket.send(JSON.stringify({ method: "BOT", value: "REMOVE" }));
	  clientLog.innerText = "Removing bot...";
	};

	//-----------------------------------------------
	// start talking with the game backend @aleborghi

	function sleep(ms) {
		return new Promise(resolve => setTimeout(resolve, ms));
	}

	function startGame(myGameID, myPlayerID) {
	  clientLog.innerText = `Game Started ${myGameID}`;

	  // open new window
	  sessionStorage.setItem("sesData", JSON.stringify({
		gameID: myGameID,
		playerID: myPlayerID,
		tournamentID: tournamentID
	  }));

	  window.location.href = "/pong";  // same window
	}

	/* -------------------------
	   WEBSOCKET EVENTS
	-------------------------- */

	socket.addEventListener("open", () => {
	  console.log("Connected to server");
	  clientLog.innerText = "Connected.";

	  // instantly AUTH after socket connection
	  socket.send(JSON.stringify({ method: "AUTH", playerID: playerID }));

	  if (tournamentID !== undefined) {
		sleep(1100) // @aleborghi sleeppino quando ti riconnetti all tournament dopo la partita
		.then(() => {
		  socket.send(JSON.stringify({ method: "JOIN", tournamentID: tournamentID }));
		  clientLog.innerText = `Joining tournament: ${tournamentID}...`;
		});
	  }
	});

	socket.addEventListener("message", (event) => {
	  try {
		console.log("TYPE OF MESSAGE:", typeof event.data, event.data);
		const data = JSON.parse(event.data);

		/* ---------------
		   tournament CREATION
		----------------- */
		if (data.method === "CREATE_REPLY") {
		  if (data.status === 'success') {
			tournamentID = data.value;
			tournamentCodeDiv.innerHTML = tournamentID;
			serverLog.innerText = `tournament created! Code: ${tournamentID}`;
		  }
		  else if (data.status === 'failure')
			serverLog.innerText = `Failed to create the tournament\n${data.comment}`;
		  return;
		}

		/* -----------
		   tournament JOIN
		------------ */
		if (data.method === "JOIN_REPLY") {
			  if (data.status === 'success') {
			tournamentID = data.value;
			tournamentCodeDiv.innerHTML = tournamentID;
		  	serverLog.innerText = `Joined tournament ${data.value}`;
		  } else if (data.status === 'failure')
				serverLog.innerText = `Failed to join ${data.value}: ${data.comment}`;
		  return;
		}

		 /* -----------
		   tournament LEAVE
		------------ */
		if (data.method === "LEAVE_REPLY") {
			  if (data.status === 'success') {
			playersDiv.innerHTML = "players"; // clear
			tournamentCodeDiv.innerHTML = "";      // clear
		  	serverLog.innerText = `Success: ${data.comment}`;
			tournamentID = undefined;
		  } else if (data.status === 'failure')
				serverLog.innerText = `Failure: ${data.comment}`;
		  return;
		}

		/* -----------
		  READY START
		------------ */
		if (data.method === "READY_REPLY") {
		  if (data.status === 'success') {
			  serverLog.innerText = `Successfully ready: ${data.comment}`;
		  }
		  else if (data.status === 'failure')
			serverLog.innerText = `Failed to start game: ${data.comment}`;
		  return;
		}

		/* -----------
		  GAME START
		------------ */
		if (data.method === "START_REPLY") {
		  if (data.status === 'success') {
			  startGame(data.value, playerID);
		  }
		  else if (data.status === 'failure')
			serverLog.innerText = `Failed to start game: ${data.comment}`;
		  return;
		}

		/* -----------
		tournament STATE
		------------ */
		if (data.ID && data.rooms) {
			const bracketDiv = document.getElementById("bracket");
			bracketDiv.innerHTML = ""; // clear

			// Group rooms by layer
			const layers = {};
			for (const room of data.rooms) {
				if (!layers[room.layer]) layers[room.layer] = [];
				layers[room.layer].push(room);
			}

			// Render each layer (round)
			Object.keys(layers)
				.sort((a, b) => Number(a) - Number(b))
				.forEach(layerKey => {
				const roundDiv = document.createElement("div");
				roundDiv.className = "round";

				const title = document.createElement("div");
				title.innerText = `Round ${Number(layerKey) + 1}`;
				title.style.fontWeight = "bold";
				roundDiv.appendChild(title);

				for (const room of layers[layerKey]) {
					const matchDiv = document.createElement("div");
					matchDiv.className = "match";

					// Players
					for (let i = 0; i < room.players.length; i++) {
					const p = document.createElement("div");
					p.innerText = room.players[i] ?? "—";

					// Highlight winner
					if (room.winner.includes(room.players[i])) {
						p.className = "winner";
					}

					matchDiv.appendChild(p);
					}

					// Score (if available)
					if (room.score.length) {
					const score = document.createElement("div");
					score.style.fontSize = "0.8em";
					score.style.marginTop = "5px";
					score.innerText = `Score: ${room.score.join(" - ")}`;
					matchDiv.appendChild(score);
					}

					roundDiv.appendChild(matchDiv);
				}

				bracketDiv.appendChild(roundDiv);
				});

			return;
		}



		/* ----------------------
		   OTHER SERVER MESSAGES
		----------------------- */
		serverLog.innerText = event.data;

	  } catch (err) {
		console.log("Error ", err);
		console.error("ACTUAL RAW STRING:", JSON.stringify(event.data));
		console.error("CHAR CODES:", [...event.data].map(c => c.charCodeAt(0)));
		clientLog.innerText = `Bad JSON: ${event.data}`;
	  }
	});

	// setInterval(() => {
	//   if (tournamentID === undefined) return;
	
	//   fetch(`http://${window.location.host}/my-tournament?ID=${tournamentID}`)
	//     .then(res => res.text())
	//     .then(text => {
	//       let data;
	//       try {
	//         data = JSON.parse(text); 
	//       } catch (err) {
	//         console.error("JSON parse failed:", text);
	//         return;
	//       }

	//       if (!data.state) {
	//         console.warn("Invalid tournament format:", data);
	//         return;
	//       }
	//       const state = data.state;

	//       playersDiv.innerHTML = ""; // clear
		// 	    let html = "";
		// 	    for (let i = 0; i < state.players.length; i++) {
		// 		    html += `${state.players[i].ID} : ${state.players[i].status}<br>`;
		// 	    }
	//       playersDiv.innerHTML = html;

	//       if (state.ingame === true && rejoin === true) {
	//         startGame(state.gameID, playerID);
	//         rejoin = false;
	//       }

	//     })
	//     .catch(err => console.error("Fetch failed:", err));
	// }, 1000);	

  </script>
</body>
</html>
