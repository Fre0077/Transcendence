services:
  # 1. RABBITMQ STARTS FIRST
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcendence

  # 2. FRONTEND STARTS AFTER RABBITMQ IS HEALTHY
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - transcendence

# 2.25. MONITORING STUFFS
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitor/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_dat:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=https://localhost:4443/prometheus/"
      - "--web.route-prefix=/"
    depends_on:
      rabbitmq:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - transcendence
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    volumes:
      - grafana_dat:/var/lib/grafana
      - ./monitor/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitor/grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml
      - ./monitor/grafana/master-dashboard.json:/var/lib/grafana/master-dashboard.json
    depends_on:
      - prometheus
    networks:
      - transcendence
    restart: always

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./monitor/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_dat:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    networks:
      - transcendence
    restart: always

  # 2.5 BUTLER che rompe i coglioni
  butler:
    build:
      context: ./backend/gateway/butler
      dockerfile: Dockerfile
    container_name: butler
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - transcendence
    restart: always

# 3. NGINX HTTPS & Certificate
  nginx:
      image: nginx:stable-alpine
      container_name: nginx
      restart: always
      ports:
        - "8080:80"
        - "4443:443"
      volumes:
        - ./nginx/conf:/etc/nginx/conf.d:ro
        - ./nginx/ssl:/etc/nginx/ssl:ro
        - avatar_data:/var/www/uploads:ro
      depends_on:
        - frontend
        - butler
      networks:
        - transcendence

  # 3. BACKEND SERVICES START LAST
  auth:
    build:
      context: ./backend/database/
      dockerfile: auth/Dockerfile
    container_name: auth
    env_file:
      - .env
    volumes:
      - auth_db:/app/database
      - avatar_data:/app/database/public/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
      frontend:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

  chat:
    build:
      context: ./backend/database/
      dockerfile: chat/Dockerfile
    container_name: chat
    env_file:
      - .env
    volumes:
      - chat_db:/app/database
    depends_on:
      rabbitmq:
        condition: service_healthy
      frontend:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

  profile:
    build:
      context: ./backend/database/
      dockerfile: profile/Dockerfile
    container_name: profile
    env_file:
      - .env
    volumes:
      - profile_db:/app/database
    depends_on:
      rabbitmq:
        condition: service_healthy
      frontend:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

  # GAME RELATED SERVICES
  ft_bunny:
    build:
      context: ./backend/services/ft_bunny
      dockerfile: Dockerfile
    container_name: ft_bunny
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

  lobby:
    build:
      context: ./backend/services/lobby
      dockerfile: Dockerfile
    container_name: lobby
    depends_on:
      ft_bunny:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

  tournament:
    build:
      context: ./backend/services/tournament
      dockerfile: Dockerfile
    container_name: tournament
    depends_on:
      ft_bunny:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

  pong:
    build:
      context: ./backend/services/pong
      dockerfile: Dockerfile
    container_name: pong
    depends_on:
      ft_bunny:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always
  
  bots:
    build:
      context: ./backend/services/bots
      dockerfile: Dockerfile
    container_name: bots
    depends_on:
      ft_bunny:
        condition: service_started
      butler:
        condition: service_started
    networks:
      - transcendence
    restart: always

networks:
  transcendence:
    driver: bridge


volumes:
  auth_db:
  chat_db:
  profile_db:
  avatar_data:
  grafana_dat:
  prometheus_dat:
  alertmanager_dat: