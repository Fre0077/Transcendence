<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ft_transcendence - A multiplayer Pong game with tournaments, chat, and more" />
    
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
    
    <!-- SEO -->
    <meta name="author" content="ft_transcendence team" />
    <meta name="keywords" content="pong, game, multiplayer, tournament, transcendence" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ft_transcendence - Pong Game" />
    <meta property="og:description" content="Play Pong online with friends, join tournaments, and chat in real-time" />
    
    <!-- Accessibility -->
    <meta name="theme-color" content="#3b82f6" />
    
    <title>ft_transcendence</title>
    
    <!-- Preconnect to API (optional, update with your API URL) -->
    <!-- <link rel="preconnect" href="http://localhost:8000"> -->
  </head>
  <body class="antialiased">
    <!-- Skip to main content link for accessibility -->
    <a 
      href="#app" 
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary-600 focus:text-white focus:rounded"
    >
      Skip to main content
    </a>

    <!-- Main app container -->
    <div id="app" role="main">
      <!-- Loading indicator shown before router initializes -->
      <div class="flex items-center justify-center min-h-screen bg-gray-50">
        <div class="text-center">
          <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-primary-600 mx-auto mb-4"></div>
          <p class="text-gray-600 text-lg">Loading ft_transcendence...</p>
          <span class="sr-only">Application is loading, please wait...</span>
        </div>
      </div>
    </div>

    <!-- Screen reader announcements for route changes (created by router) -->
    <!-- This div is created dynamically by the router for accessibility -->

    <!-- Main application script -->
    <script type="module" src="/main.ts"></script>
  </body>
</html>
